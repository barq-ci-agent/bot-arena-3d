<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zombie Street 3D</title>
<style>html,body{margin:0;height:100%;background:#0d0620;overflow:hidden;font-family:system-ui,sans-serif}#stage{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);overflow:hidden;background:#000}canvas{position:absolute;inset:0;width:100%;height:100%}
#ui{position:fixed;right:12px;bottom:12px;display:flex;gap:8px;z-index:3}button{background:#ffffff22;color:#fff;border:1px solid #ffffff55;border-radius:8px;padding:8px 12px;font-size:14px;cursor:pointer}button:hover{background:#ffffff44}
#tip{position:fixed;left:12px;bottom:12px;color:#ffffffaa;font-size:12px;z-index:3}</style></head>
<body><div id="stage"><canvas id="cv"></canvas><canvas id="hd"></canvas></div>
<div id="tip">F fullscreen, H hide buttons, 1-4 camera</div>
<div id="ui"><button id="cam">Camera: Auto camera</button></div>
<script src="bundle.js"></script></body></html>
